name: ${COMPOSE_PROJECT_NAME:-frost-route}

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - '127.0.0.1:${MQTT_PORT:-1883}:1883'
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h 127.0.0.1 -p 1883
          -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 5s

  timescaledb:
    image: timescale/timescaledb:2.28.3-pg17
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frost_route}
      POSTGRES_USER: ${POSTGRES_USER:-frost_route}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mosquitto-data:
  timescaledb-data:
